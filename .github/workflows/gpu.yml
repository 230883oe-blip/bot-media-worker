name: gpu-probe

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'note'
        required: false
        default: 'probe'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 הוא Intel בלי GPU נגיש, והתור שלו היה 12 דקות. הוסר.
        os: [macos-15, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # על אפל הזיכרון משותף; בלי זה MPS מסרב להקצות על רנר של 7GB.
      PYTORCH_MPS_HIGH_WATERMARK_RATIO: '0.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # torch מותקן רק על אפל: שם הוא נושא MPS. על לינוקס החינמי אין CUDA
      # (נמדד 07/10), ולכן גלגל של 900MB שם הוא בזבוז של דקות ענן.
      - name: torch (apple only)
        if: startsWith(matrix.os, 'macos')
        run: python -m pip install --quiet --disable-pip-version-check torch

      - name: probe
        env:
          PROBE_LABEL: ${{ matrix.os }}
        run: python gpucloud/probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: gpucloud/probe_*.json
          if-no-files-found: warn
