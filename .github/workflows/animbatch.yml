name: anim-batch

# אצווה כבדה של האנימציה על רנר אפל חינמי.
#
# מה רץ כאן ומה לא, ושני הדברים נמדדו 07/10 ולא הוערכו:
#  * רץ: מסלול הפוזות ושיפוט המבקרים (numpy), וסריקות פרמטרים.
#    הם מתפצלים לעבודות בלי שום תלות, ולכן המטריצה היא כל המקביליות.
#  * לא רץ: רינדור הדפדפן. ל-VM של הרנר אין מושב גרפי, Chrome שם נתקע
#    ולא החזיר DOM. רינדור נשאר על הכרטיס המקומי.
#
# ``macos-15`` בלבד: ``macos-14`` נפל ב-MPS out of memory גם על מטריצה
# של 1024, ולרנרי ubuntu/windows אין GPU כלל.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'כמה רנרים במקביל'
        required: false
        default: '6'
      runner:
        description: 'תווית הרנר'
        required: false
        default: 'macos-15'
      ticket:
        description: 'מזהה הכרטיס (לשיוך בחזרה)'
        required: false
        default: ''

jobs:
  # ``strategy.matrix`` אינו מקבל ערך דינמי מ-inputs, ולכן המטריצה
  # קבועה ורנר שאין לו עבודות יוצא מיד עם 0 עבודות. זה זול מרנר
  # שנשלף ממטריצה שנבנית בעבודה נפרדת (עוד המתנה בתור).
  batch:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    env:
      # על אפל הזיכרון משותף עם המערכת; בלי זה MPS מסרב להקצות
      # על רנר של 7GB גם כשהוא מדווח 7.93 פנויים.
      PYTORCH_MPS_HIGH_WATERMARK_RATIO: '0.0'
      BATCH_RUNNER: ${{ inputs.runner || 'macos-15' }}
      BATCH_TICKET: ${{ inputs.ticket }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: unpack sources
        run: |
          python -c "import zipfile;zipfile.ZipFile('animbatch/sources.zip').extractall('.')"
          ls -1 showreel studio rig | head -40

      - name: deps
        run: python -m pip install --quiet --disable-pip-version-check numpy

      # torch רק על אפל, ורק כאן הוא נושא MPS. על לינוקס החינמי אין
      # CUDA (נמדד), ולכן גלגל של 900MB שם הוא דקות ענן לפח.
      - name: torch (apple only)
        if: startsWith(env.BATCH_RUNNER, 'macos')
        continue-on-error: true
        timeout-minutes: 8
        run: python -m pip install --quiet --disable-pip-version-check torch

      - name: run shard
        run: |
          python showreel/batch_worker.py \
            --shard ${{ matrix.shard }} \
            --total 6 \
            --payload animbatch/payload.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animbatch-${{ matrix.shard }}
          path: animbatch/result-shard*.json
          if-no-files-found: warn
