name: end6
on:
  workflow_dispatch:
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install gradio_client av pillow opencv-python-headless numpy
      - run: python chain2/step_end.py 6 chain2/last_5.png
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-6
          path: artifacts/
