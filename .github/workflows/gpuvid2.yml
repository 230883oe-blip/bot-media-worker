name: gpu-video-chain

# הפקת סרטון הנפשה על A10G חינמי, במקביל על כמה רנרים.
# נמדד 11/10: רנר אחד מחזיק בדיוק **שלוש** קריאות LTX לפני
# ש-ZeroGPU מחזיר -60s. לכן התקציב הוא מספר הרנרים, ו-steps=3.
# כל רנר הוא **כתובת IP אחרת**, כלומר ארנק ZeroGPU נפרד - וזה
# מה שהופך את זה למאגר נקודות קצה ולא לנקודה בודדת שנחנקת.
# מאגר ציבורי = דקות בלתי מוגבלות.

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: 'מזהה כרטיס'
        required: false
        default: ''
      steps:
        description: 'קטעים לכל רנר (תקרה 3 - מעבר לזה הארנק נגמר)'
        required: false
        default: '3'
      secs:
        description: 'שניות לקטע'
        required: false
        default: '3'

jobs:
  chain:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # numpy במפורש: `av` מותקן בלעדיו, ו-`frame.to_ndarray` נופל
      # ב-ModuleNotFoundError. בריצה הראשונה זה שבר את השרשרת אחרי
      # קטע אחד, בלי ששום קריאת GPU נכשלה באמת.
      - run: pip -q install gradio_client pillow av numpy
      - name: chain
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          # STEPS כאן הוא גיבוי בלבד. המספר הקובע הוא
          # `plan[SHARD-1]` מתוך `gpuvid/beats.json`, כדי שחלוקה
          # לא-שווה (3,3,2) תעבוד ושרנר של שוט ששמור במטמון יצא
          # מיד בלי לגעת ב-GPU.
          STEPS: ${{ inputs.steps || '3' }}
          SECS: ${{ inputs.secs || '3' }}
          PACE: '8'
        run: python gpuvid/chain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-${{ matrix.shard }}-${{ inputs.ticket }}
          path: artifacts/
          if-no-files-found: warn
