name: tex3d-test
on:
  workflow_dispatch:
jobs:
  tex:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install gradio_client
      - name: generation_all
        continue-on-error: true
        run: python tex3d/job.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tex3d
          path: artifacts/
          if-no-files-found: warn
