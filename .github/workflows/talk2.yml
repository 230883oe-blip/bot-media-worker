name: talk2
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install gradio_client av pillow opencv-python-headless numpy
      - run: python talk/close2.py
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talk2
          path: artifacts/
