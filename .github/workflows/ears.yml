name: ears
on:
  workflow_dispatch:
jobs:
  e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install faster-whisper numpy
      - run: python ears_job/ears.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ears
          path: artifacts/
