name: claude
# מכסת Claude Code בענן (01/10/2026).
#
# למה זה קיים: המחשב של המשתמש הוא היחיד שבו מותקן Claude Code, ולכן
# כשהוא כבוי אין שום דרך להשתמש במכסת המנוי. GitHub Actions נותן אובונטו
# שלם, חינם, בלי כרטיס אשראי, ומופעל בבקשת HTTP אחת - כלומר גם המוח בענן
# (Apps Script) יכול להפעיל אותו לבד. Claude Code מותקן כאן בכל ריצה
# ומזדהה עם אסימון המנוי שיושב כסוד מוצפן בריפו.
#
# מלכודות שנכתבו כאן במפורש:
#   * ב-headless (`-p`) כל שימוש בכלי נחסם עד שמאשרים. על רנר חד-פעמי
#     ש-GitHub משמיד בסוף הריצה `--dangerously-skip-permissions` הוא
#     הנכון; הוא *מסורב* אם רצים כ-root, ולכן אין כאן sudo ואין קונטיינר.
#   * אסור להדביק `inputs.task` לתוך שורת shell - טקסט עברי עם גרשיים או
#     `$(` היה נפרס כפקודה. לכן הוא עובר דרך משתנה סביבה בלבד.
#   * `npm i -g` על ubuntu-latest עם setup-node לא צריך sudo.
#   * שלב השליחה הוא `if: always()` - תשובה חלקית או שגיאה חייבות להגיע
#     למשתמש, אחרת הוא מחכה לנצח להודעה שלא תבוא.
on:
  workflow_dispatch:
    inputs:
      task:
        description: המשימה לקלוד
        required: true
      chat:
        description: מזהה צ'אט בטלגרם לתשובה (ריק = בלי שליחה)
        required: false
        default: ''
      minutes:
        description: תקרת זמן לריצת קלוד
        required: false
        default: '25'
      repo:
        description: ריפו לעבוד עליו (ריק = תיקייה ריקה)
        required: false
        default: ''

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: הכנת תיקיית עבודה
        env:
          WREPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p /tmp/ws
          if [ -n "$WREPO" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${WREPO}.git" /tmp/ws/repo || true
          fi

      - name: הרצת קלוד
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK: ${{ inputs.task }}
          MINUTES: ${{ inputs.minutes }}
        working-directory: /tmp/ws
        run: |
          set +e
          printenv TASK > /tmp/task.txt
          timeout "${MINUTES}m" claude -p "$(cat /tmp/task.txt)" \
            --dangerously-skip-permissions \
            --output-format text > /tmp/answer.txt 2> /tmp/err.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- rc=$rc ---"
          head -c 4000 /tmp/answer.txt
          echo ""
          echo "--- stderr ---"
          tail -c 2000 /tmp/err.txt
          exit 0

      - name: סיכום לדף הריצה
        if: always()
        run: |
          {
            echo "### תשובת קלוד מהענן"
            echo '```'
            head -c 60000 /tmp/answer.txt 2>/dev/null || echo "(ריק)"
            echo '```'
            echo "קוד יציאה: ${{ steps.run.outputs.rc }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: שליחה לטלגרם
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT: ${{ inputs.chat }}
          RC: ${{ steps.run.outputs.rc }}
        run: python3 cloudclaude/tg_send.py /tmp/answer.txt /tmp/err.txt

      - name: שמירת התשובה כפלט
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer
          path: |
            /tmp/answer.txt
            /tmp/err.txt
          if-no-files-found: warn
