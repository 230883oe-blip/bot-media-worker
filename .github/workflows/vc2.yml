name: vc2
on:
  workflow_dispatch:
jobs:
  v:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install gradio_client av numpy
      - run: python vc/vc2.py
        env:
          SHARD: ${{ matrix.shard }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc-${{ matrix.shard }}
          path: artifacts/
