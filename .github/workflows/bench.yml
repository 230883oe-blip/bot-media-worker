name: bench
on:
  workflow_dispatch:
    inputs:
      scale:
        description: "chunk of the workload (1.0 = full)"
        default: "1.0"

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: spec
        run: |
          nproc
          (grep -m1 "model name" /proc/cpuinfo || grep -m1 "BogoMIPS" /proc/cpuinfo) || true
          grep -m1 MemTotal /proc/meminfo
          uname -m
          (nvidia-smi --query-gpu=name --format=csv,noheader && echo HAS_GPU=1) || echo HAS_GPU=0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: deps
        run: |
          S=$(date +%s)
          python -m pip install --quiet --disable-pip-version-check numpy av
          E=$(date +%s)
          echo "setup_seconds=$((E-S))" > extra.txt
          cat extra.txt

      - name: run benchmark
        run: |
          S=$(date +%s)
          python bench/workload.py --scale "${{ inputs.scale }}" \
            --out /tmp/bench_enc.mp4 > result.json
          E=$(date +%s)
          echo "wall_seconds=$((E-S))" >> extra.txt
          python - <<PY
          import json, pathlib
          p = pathlib.Path("result.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          extra = {}
          for ln in pathlib.Path("extra.txt").read_text().splitlines():
              if "=" in ln:
                  k, v = ln.strip().split("=", 1)
                  try:
                      extra[k] = float(v)
                  except ValueError:
                      extra[k] = v
          d["cloud"] = extra
          d["runner_label"] = "${{ matrix.runner }}"
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(d["stages"], indent=2))
          PY
          cp result.json "result-${{ matrix.runner }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.runner }}
          path: result-*.json
