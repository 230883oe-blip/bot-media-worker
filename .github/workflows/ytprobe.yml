name: ytprobe
# בדיקת שטח: אילו מסלולי הורדה מיוטיוב עובדים מ-IP של רנר (25/10/2026).
# אין כאן שום סוד ואין קלט — רק מדידה שמודפסת ליומן הריצה.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q --disable-pip-version-check yt-dlp
      - name: probe
        run: python cloudclaude/ytprobe.py
