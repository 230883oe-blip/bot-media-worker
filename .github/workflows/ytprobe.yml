name: ytprobe
# בדיקת שטח: אילו מסלולי הורדה מיוטיוב עובדים מ-IP של רנר (25/10/2026).
# סבב ב' בודק את המסלול "הענן מבקש, הרנר מוריד" מקצה לקצה.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: probe
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_ADMIN: ${{ secrets.GAS_ADMIN }}
        run: python cloudclaude/ytprobe.py
