name: media
# מכונת העיבוד של הבוט. מופעלת בבקשת HTTP מהמוח בענן (Apps Script),
# ולכן אין שום חלון שצריך לפתוח ושום לחיצה. אובונטו מלא עם ffmpeg.
#
# הקלט נושא רק אסימון חד-פעמי (nonce) ולא את הסוד עצמו — העובד פודה
# אותו מול הענן בעלייה, וכך שום סוד לא יושב ב-GitHub.
on:
  workflow_dispatch:
    inputs:
      u:
        description: כתובת המוח בענן
        required: true
      n:
        description: אסימון חד-פעמי
        required: true

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - run: echo "::add-mask::${{ inputs.n }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 01/10 (ד) — המכונה נתקעה 25 דקות בשלב הזה ומעולם לא הגיעה לעבודה.
      # נמדד: הריצה דיווחה in_progress על "fonts + tools" ברצף, והענן ראה
      # worker_alive=false לכל אורכה. הסיבה: `apt-get update` + התקנת ffmpeg
      # על רנר שבו ffmpeg *כבר מותקן* — מאות מגה של תלויות, ו-apt שנתקע על
      # שאלה אינטראקטיבית נשאר תקוע עד ה-timeout של כל המשימה (55 דקות).
      # שלושה כללים שנאכפים כאן עכשיו:
      #   * לא מתקינים מה שקיים. בודקים ואז מתקינים.
      #   * DEBIAN_FRONTEND=noninteractive — אחרת apt יכול לחכות לקלט לנצח.
      #   * תקרת זמן *לשלב* + continue-on-error: שלב התקנה שנתקע לא יבלע
      #     את המכונה ולא ימנע מהעובד לעלות בכלל. ההתקנה היא נוחות; העובד
      #     הוא העבודה.
      - name: fonts
        timeout-minutes: 6
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ffmpeg -version >/dev/null 2>&1; then
            echo "ffmpeg כבר מותקן: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          if fc-list 2>/dev/null | grep -qi dejavu; then
            echo "גופן DejaVu קיים"
          else
            sudo apt-get install -y -qq fonts-dejavu-core
          fi
      # pip הוא חובה: בלי yt-dlp אין הורדה ובלי telethon אין קובץ מעל 20 מגה.
      - name: tools
        timeout-minutes: 8
        run: python -m pip install -q --disable-pip-version-check yt-dlp telethon
      - name: worker
        env:
          CLOUD_URL: ${{ inputs.u }}
          CLOUD_NONCE: ${{ inputs.n }}
          WORKER_DIR: /tmp/mediaworker
        run: python worker.py
