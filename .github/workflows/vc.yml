name: vc
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install gradio_client av numpy
      - run: python vc/vc.py
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc
          path: artifacts/
